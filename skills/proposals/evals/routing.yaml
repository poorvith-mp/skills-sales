  - 'draft a detailed Statement of Work (SOW) outlining project scope, deliverables, and timeline'
  - 'structure a 3-tier pricing proposal: Good, Better, Best to encourage tier upgrades'
  - 'summarize a prospect''s challenges and our proposed solution in an executive proposal brief'
  - 'craft business case slides showing payback period and total cost of ownership savings'
  - 'include clear terms, assumptions, and scope exclusions to prevent project creep in an SOW'
  - 'design a visually polished proposal document that enterprise procurement can sign off on'
  - 'revise a rejected sales proposal to address stakeholder budget constraints'
should_not_fire:
